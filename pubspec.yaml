name: neu_portal
description: "东北大学一号通门户 — Material 3 多端客户端（Android / iOS / Windows / Web）"
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.12.1 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^9.2.0
  real_liquid_glass: 0.3.0
  webview_flutter_wkwebview: ^3.27.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  webview_flutter_platform_interface: ^2.15.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_main.png"
  image_path_ios: "assets/icon/icon_main.png"
  remove_alpha_ios: true
  background_color_ios: "#3553A2"
  image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/icon_main.png"
    background_color: "#3553A2"
    theme_color: "#3553A2"
  windows:
    generate: true
    image_path: "assets/icon/icon_main.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# 每夜构建：push 到 main 自动编译 Android APK + iOS IPA，并发布到 Releases
# （Releases 页 → nightly 标签 → 无需登录直接下载）
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: node tools/test_portal_document.mjs
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # UIGlassEffect requires building against the iOS 26 SDK or newer.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: node tools/test_portal_document.mjs

      - name: Test IPA validation
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/Payload/Runner.app
          cd build/ios
          zip -qry -X dongda-yihaotong-unsigned.ipa Payload
          cd ../..
          python3 tools/verify_ipa.py build/ios/dongda-yihaotong-unsigned.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: ipa
          path: build/ios/dongda-yihaotong-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp dist/apk/app-release.apk out/dongda-yihaotong-nightly.apk
          cp dist/ipa/dongda-yihaotong-unsigned.ipa out/dongda-yihaotong-nightly-unsigned.ipa
          python3 tools/verify_ipa.py out/dongda-yihaotong-nightly-unsigned.ipa
          (
            cd out
            zip -q -0 dongda-yihaotong-nightly-ios.zip dongda-yihaotong-nightly-unsigned.ipa
            unzip -t dongda-yihaotong-nightly-ios.zip
            sha256sum dongda-yihaotong-nightly.apk dongda-yihaotong-nightly-unsigned.ipa dongda-yihaotong-nightly-ios.zip > SHA256SUMS.txt
          )
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHA=${GITHUB_SHA::7}
          cat > notes.md <<NOTES
          ## 每夜构建（Nightly）

          自动构建于 $DATE · commit \`$SHA\`

          | 文件 | 用途 |
          | --- | --- |
          | dongda-yihaotong-nightly.apk | Android 直接安装 |
          | dongda-yihaotong-nightly-unsigned.ipa | iOS 未签名 IPA，签名后安装；直接下载失败时请用下面的 ZIP |
          | dongda-yihaotong-nightly-ios.zip | iOS：内含未签名 IPA（下载后解压，用 Sideloadly / AltStore / 爱思助手 + Apple ID 签名后安装） |
          | SHA256SUMS.txt | 校验和（下载后核对完整性） |

          详细安装说明见 README。
          若提示 missingEndOfCentralDirectoryRecord，请重新下载 ZIP，解压出 IPA 后导入，并核对 SHA256SUMS.txt；不要将网页或外层 ZIP 改名为 IPA。
          NOTES
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            --title "每夜构建 Nightly · $DATE" \
            --notes-file notes.md \
            out/dongda-yihaotong-nightly.apk \
            out/dongda-yihaotong-nightly-unsigned.ipa \
            out/dongda-yihaotong-nightly-ios.zip \
            out/SHA256SUMS.txt

# 无 Mac 编译 IPA：GitHub 提供 macOS 云跑机（公共仓库免费）
# 产物为「未签名 IPA」，用 Sideloadly / AltStore / 爱思助手 + 个人 Apple ID 签名后即可安装
name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qry dongda-yihaotong-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dongda-yihaotong-unsigned-ipa
          path: build/ios/dongda-yihaotong-unsigned.ipa
